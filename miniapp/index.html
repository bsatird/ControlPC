<!doctype html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0c11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ControlPC — панель керування</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="backdrop__glow backdrop__glow--blue"></span>
    <span class="backdrop__glow backdrop__glow--violet"></span>
    <span class="backdrop__grid"></span>
  </div>
  <div class="load-bar" id="load-bar" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4" width="19" height="13" rx="2.8"></rect>
          <path d="M8.5 20.5h7M12 17v3.5"></path>
        </svg>
      </span>
      <span class="brand__text">
        <strong>ControlPC</strong>
        <span class="brand__version" id="bot-version">v3.3</span>
      </span>
    </div>
    <button id="refresh-btn" class="icon-btn" type="button" aria-label="Оновити дані">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 12a8 8 0 1 1-2.6-5.9"></path>
        <path d="M20 4.5V10h-5.5"></path>
      </svg>
    </button>
  </header>

  <!-- Екран завантаження -->
  <section id="screen-loading" class="screen screen--center">
    <div class="loader" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="muted">Перевіряємо доступ до ПК…</p>
  </section>

  <!-- Екран помилки -->
  <section id="screen-error" class="screen screen--center hidden">
    <div class="error-card glass">
      <div class="error-card__icon" aria-hidden="true">🔒</div>
      <h2 id="error-title">Немає доступу</h2>
      <p id="error-text" class="muted"></p>
      <button id="retry-btn" class="btn btn--primary" type="button">Спробувати ще раз</button>
    </div>
  </section>

  <!-- Основний екран -->
  <main id="screen-main" class="screen hidden">
    <section class="hero glass">
      <div class="hero__head">
        <div class="hero__title">
          <p class="hero__eyebrow">Мій комп'ютер</p>
          <h1 id="pc-name">ControlPC</h1>
        </div>
        <span class="pill" id="conn-pill">
          <span class="dot" id="conn-dot"></span>
          <span id="conn-text">підключення…</span>
        </span>
      </div>
      <p class="hero__sub" id="pc-subtitle">—</p>
      <div class="hero__chips">
        <span class="chip">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
          <b id="info-uptime">—</b>
        </span>
        <span class="chip">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20 4.5V10h-5.5"></path></svg>
          <b id="updated-at">—</b>
        </span>
      </div>
      <p class="hero__foot muted" id="next-refresh">автооновлення кожні 10 с</p>
    </section>

    <section class="metrics" aria-label="Системні показники">
      <button class="metric glass" id="card-cpu" type="button" data-metric="cpu">
        <span class="metric__head">
          <span class="metric__icon metric__icon--blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="7" y="7" width="10" height="10" rx="2.4"></rect>
              <path d="M10 3.2v2M14 3.2v2M10 18.8v2M14 18.8v2M3.2 10h2M3.2 14h2M18.8 10h2M18.8 14h2"></path>
            </svg>
          </span>
          <span class="metric__label">Процесор</span>
          <span class="metric__chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </span>
        </span>
        <span class="metric__value"><span id="cpu-val">—</span><span class="metric__unit">%</span></span>
        <span class="bar"><i id="cpu-bar"></i></span>
        <span class="metric__foot" id="cpu-foot">—</span>
        <span class="metric__detail" id="cpu-detail">—</span>
      </button>

      <button class="metric glass" id="card-ram" type="button" data-metric="ram">
        <span class="metric__head">
          <span class="metric__icon metric__icon--violet" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.8" y="8" width="18.4" height="8" rx="2.2"></rect>
              <path d="M7 8V5.8M12 8V5.8M17 8V5.8M7 16v2.2M12 16v2.2M17 16v2.2"></path>
            </svg>
          </span>
          <span class="metric__label">Пам'ять</span>
          <span class="metric__chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </span>
        </span>
        <span class="metric__value"><span id="ram-val">—</span><span class="metric__unit">%</span></span>
        <span class="bar"><i id="ram-bar"></i></span>
        <span class="metric__foot" id="ram-foot">—</span>
        <span class="metric__detail" id="ram-detail">—</span>
      </button>

      <button class="metric glass" id="card-disk" type="button" data-metric="disk">
        <span class="metric__head">
          <span class="metric__icon metric__icon--cyan" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4.5" width="18" height="15" rx="3"></rect>
              <circle cx="12" cy="12" r="3.2"></circle>
              <path d="M17.3 17.4h.01"></path>
            </svg>
          </span>
          <span class="metric__label">Диск</span>
          <span class="metric__chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </span>
        </span>
        <span class="metric__value"><span id="disk-val">—</span><span class="metric__unit">%</span></span>
        <span class="bar"><i id="disk-bar"></i></span>
        <span class="metric__foot" id="disk-foot">—</span>
        <span class="metric__detail" id="disk-detail">—</span>
      </button>

      <button class="metric glass" id="card-bat" type="button" data-metric="bat">
        <span class="metric__head">
          <span class="metric__icon metric__icon--green" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.6" y="8" width="16.2" height="8" rx="2.6"></rect>
              <path d="M21.2 11v2"></path>
              <rect x="4.9" y="10.1" width="5.4" height="3.8" rx="1" fill="currentColor" stroke="none"></rect>
            </svg>
          </span>
          <span class="metric__label">Батарея</span>
          <span class="metric__chev" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
          </span>
        </span>
        <span class="metric__value"><span id="bat-val">—</span><span class="metric__unit">%</span></span>
        <span class="bar"><i id="bat-bar"></i></span>
        <span class="metric__foot" id="bat-foot">—</span>
        <span class="metric__detail" id="bat-detail">—</span>
      </button>
    </section>

    <section class="block">
      <div class="block__head">
        <h2>Керування ПК</h2>
        <span class="badge">Етап 3</span>
      </div>
      <div class="nav">
        <button class="nav__item glass" type="button" data-nav="power" data-nav-label="Живлення">
          <span class="nav__icon nav__icon--rose" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v8.4"></path><path d="M7.4 6.4a7.6 7.6 0 1 0 9.2 0"></path></svg>
          </span>
          <span class="nav__label">Живлення</span>
          <span class="nav__hint">скоро</span>
        </button>
        <button class="nav__item glass" type="button" data-nav="media" data-nav-label="Медіа">
          <span class="nav__icon nav__icon--blue" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.4 5.6l10.4 6.4-10.4 6.4z"></path></svg>
          </span>
          <span class="nav__label">Медіа</span>
          <span class="nav__hint">скоро</span>
        </button>
        <button class="nav__item glass" type="button" data-nav="files" data-nav-label="Файли">
          <span class="nav__icon nav__icon--violet" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.4A2.4 2.4 0 0 1 5.4 5h3.3l2 2.4h7.9A2.4 2.4 0 0 1 21 9.8v6.8A2.4 2.4 0 0 1 18.6 19H5.4A2.4 2.4 0 0 1 3 16.6z"></path></svg>
          </span>
          <span class="nav__label">Файли</span>
          <span class="nav__hint">скоро</span>
        </button>
        <button class="nav__item glass" type="button" data-nav="apps" data-nav-label="Додатки">
          <span class="nav__icon nav__icon--amber" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="3.4" width="7" height="7" rx="2"></rect><rect x="13.6" y="3.4" width="7" height="7" rx="2"></rect><rect x="3.4" y="13.6" width="7" height="7" rx="2"></rect><rect x="13.6" y="13.6" width="7" height="7" rx="2"></rect></svg>
          </span>
          <span class="nav__label">Додатки</span>
          <span class="nav__hint">скоро</span>
        </button>
        <button class="nav__item glass" type="button" data-nav="camera" data-nav-label="Камера">
          <span class="nav__icon nav__icon--cyan" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 9.2A2.8 2.8 0 0 1 6.2 6.4h1.6l1.4-2h5.6l1.4 2h1.6a2.8 2.8 0 0 1 2.8 2.8v7.6a2.8 2.8 0 0 1-2.8 2.8H6.2a2.8 2.8 0 0 1-2.8-2.8z"></path><circle cx="12" cy="12.8" r="3.3"></circle></svg>
          </span>
          <span class="nav__label">Камера</span>
          <span class="nav__hint">скоро</span>
        </button>
        <button class="nav__item glass" type="button" data-nav="terminal" data-nav-label="Термінал">
          <span class="nav__icon nav__icon--slate" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.4" width="18" height="15.2" rx="3"></rect><path d="M7.4 9.8l2.6 2.2-2.6 2.2M13 14.2h4"></path></svg>
          </span>
          <span class="nav__label">Термінал</span>
          <span class="nav__hint">скоро</span>
        </button>
      </div>
    </section>

    <section class="panel glass">
      <div class="panel__head">
        <h2>Про систему</h2>
        <span class="badge badge--ghost">API <b id="info-api">—</b></span>
      </div>
      <ul class="kv">
        <li><span>ПК</span><b id="info-pc">—</b></li>
        <li><span>Система</span><b id="info-platform">—</b></li>
        <li><span>Версія ControlPC</span><b id="info-bot">—</b></li>
        <li><span>Останній знімок</span><b id="info-timestamp">—</b></li>
      </ul>
    </section>

    <section class="panel glass">
      <div class="panel__head">
        <h2>Найбільші процеси</h2>
        <span class="badge badge--ghost">RAM</span>
      </div>
      <ul class="procs" id="proc-list">
        <li class="procs__empty muted">—</li>
      </ul>
    </section>

    <footer class="footer">
      <span id="foot-user">—</span>
      <span class="footer__sep" aria-hidden="true">·</span>
      <span>Mini App</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
